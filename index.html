<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="קרנף נדל&quot;ן" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#1a2233" />
    <!-- Fonts are self-hosted (@fontsource) — no render-blocking Google Fonts CSS -->
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1659334891302781');
      // PageView is fired per route (with a Hebrew page name) from the app's
      // PixelTracker, so it also counts navigations inside this SPA.
    </script>
    <!-- End Meta Pixel Code -->
    <!-- A/B assignment — runs before hydration so variants never flicker.
         Deterministic per visitor: FNV-1a(visitorId + experimentId) % 100.
         Assignments land on <html data-exp-*> (CSS can switch pre-rendered
         copy with zero CLS) and on window.__exp for the useExperiment hook. -->
    <script>
      (function () {
        // id: [variantName, weightPercent] — weights must sum to 100.
        var EXPERIMENTS = { hero: [["a", 50], ["b", 50]] };
        try {
          var KEY = "karnaf_vid";
          var vid = localStorage.getItem(KEY);
          if (!vid) {
            vid = (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
            localStorage.setItem(KEY, vid);
          }
          var assignments = {};
          Object.keys(EXPERIMENTS).forEach(function (exp) {
            var seed = vid + ":" + exp;
            var h = 2166136261;
            for (var i = 0; i < seed.length; i++) {
              h ^= seed.charCodeAt(i);
              h = (h * 16777619) >>> 0;
            }
            var bucket = h % 100;
            var acc = 0;
            var variant = EXPERIMENTS[exp][0][0];
            for (var j = 0; j < EXPERIMENTS[exp].length; j++) {
              acc += EXPERIMENTS[exp][j][1];
              if (bucket < acc) { variant = EXPERIMENTS[exp][j][0]; break; }
            }
            assignments[exp] = variant;
            document.documentElement.setAttribute("data-exp-" + exp, variant);
          });
          window.__exp = assignments;
        } catch (e) {
          window.__exp = {};
        }
      })();
    </script>
  </head>
  <body>
    <!-- Meta Pixel (noscript fallback) -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1659334891302781&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
